<div class="container-detalle">
  <div class="galeria">
    <div class="miniaturas">
      <img *ngFor="let img of producto.imagenes" [src]="img" (click)="setImagen(img)" [class.active]="img === imagenPrincipal">
    </div>
    <div class="foto-grande">
      <img [src]="imagenPrincipal" alt="Zapato Andar">
      <div class="sello-bolivia">HECHO EN BOLIVIA</div>
    </div>
  </div>

  <div class="info">
    <span class="categoria">CALZADO ARTESANAL</span>
    <h1>{{producto.nombre}}</h1>
    <p class="descripcion">{{producto.descripcion}} [cite: 33]</p>
    
    <div class="precio">Bs {{producto.precio}} [cite: 38]</div>

    <div class="ficha-tecnica">
      <p><strong>Material:</strong> {{producto.material}} [cite: 34]</p>
      <p><strong>Interior:</strong> {{producto.detalles}} [cite: 34]</p>
    </div>

    <div class="tallas-section">
      <p>Seleccione su talla:</p>
      <div class="grid-tallas">
        <button *ngFor="let t of producto.tallas" (click)="setTalla(t)" [class.selected]="t === tallaSeleccionada">
          {{t}}
        </button>
      </div>
    </div>

    <button class="btn-carrito" [disabled]="!tallaSeleccionada">
      AÑADIR AL CARRITO 🛒
    </button>
  </div>
</div>
